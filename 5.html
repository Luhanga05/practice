<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const delayedMessage = (message, delay, callback) => {
            setTimeout(() => callback(message),delay)};
            delayedMessage("hello",7000,(msg) => {
                console.log(msg);
            });
    </script>
</body>
</html>
