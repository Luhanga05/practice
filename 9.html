<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    function repeatMessage(message,interval,callback){
        let count = 0;
        const maxCount = 5;

        const timer = setInterval(() => {
            callback(message);
            count++;
            if(count===maxCount){
                clearInterval(timer);
            }
        }, interval)
    }
    repeatMessage("repeating.....",1000,msg => console.log(msg));
   </script> 
</body>
</html>
