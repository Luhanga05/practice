<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let value=2;
        switch(value){
            case 1:
                console.log("value is 1");
            break;
            case 2:
                console.log("value is 2");
            break;
            case 3:
                console.log("value is 3");
            break;
            default:
                console.log("value is something else");

        }
    </script>
</body>
</html>
