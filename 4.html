<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       const fetchData = () => [
        {id: 1,name:"A"},
        {id: 2,name:"B"},
        {id: 3,name:"C"}
    ];

    const processData = (callback) => {
        console.log("processing data wait 5 seconds");
        setTimeout(() => {
            const result = callback();
            console.log('Fetched data: ',result);
        }, 5000);
    };
    processData(fetchData);
    </script>
</body>
