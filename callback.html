<body>
    <script>
        function add(num1,num2){
            return num1+num2;
        }
        function multiply(num1,num2){
            return num1*num2;
        }
        function processMath(num1,num2,callback){
            const result = callback(num1,num2);
            console.log(result);
        }
        processMath(5,6,add);
        processMath(45,34,multiply);

    </script>
</body>
