<body>
    <script>
        function divide(num1,num2){
            return num1/num2;
        }
        function multi(num1,num2){
            return num1*num2;
        }
        function calcu(num1,num2,callback){
            const result = callback(num1,num2);
            console.log(result);
        }
        calcu(8,2,divide);
        calcu(8,2,multi);
    </script>
</body>
