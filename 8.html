<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sortAndPrint (arr,sortCallback,printCallback){
            const sortedArray = sortCallback(arr);
            printCallback(sortedArray);
        }
        sortAndPrint([5,7,8,9,14,2,1], array=>array.slice().sort((a,b)=>a-b), array => console.log("sorted array",array)
    );
    </script>
</body>
</html>
