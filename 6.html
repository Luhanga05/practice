<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
     function repeatString (str, n , callback){
        const result = str.repeat(n);
        callback(result);
     }
     repeatString("hello",7,function(result){
        console.log("repeat: " +result);
     });
</script>
</body>
</html>
